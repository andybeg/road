# Post-installation tasks:
# 1. Inject StartupWMClass into the system .desktop file for correct icon association
# 2. Remove conflicting tropa.desktop files from users' .local directories (cleanup AppImage artifacts)
# 3. Update the desktop database to apply changes immediately
postinstall_scripts:
  - echo "Setting up Tropa..."
  - sudo sed -i '/^\[Desktop Entry\]/a StartupWMClass=com.andybeg.tropa' "/usr/share/applications/tropa.desktop"
  - echo "Search and remove tropa.desktop from .local"
  - for user_dir in /home/*; do if [ -f "$user_dir/.local/share/applications/tropa.desktop" ]; then rm -f "$user_dir/.local/share/applications/tropa.desktop"; echo "Found and removed tropa.desktop from $user_dir .local"; fi; done
  - update-desktop-database /usr/share/applications
  - echo "Tropa is ready to use :)"

# Post-uninstallation tasks:
# 1. Iterate through all user directories to remove Tropa configuration and data
# 2. Clean up root user data to ensure a clean removal
postuninstall_scripts:
  - echo "Removing Tropa user data..."
  - for user_dir in /home/*; do if [ -d "$user_dir/.local/share/tropa" ]; then rm -rf "$user_dir/.local/share/tropa"; echo "Removed data from $user_dir"; fi; done
  - rm -rf /root/.local/share/tropa
  - echo "Tropa data cleanup complete."

