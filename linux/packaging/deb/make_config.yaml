# Post-installation tasks:
# 1. Inject StartupWMClass into the system .desktop file for correct icon association
# 2. Remove conflicting road.desktop files from users' .local directories (cleanup AppImage artifacts)
# 3. Update the desktop database to apply changes immediately
postinstall_scripts:
  - echo "Setting up Road..."
  - sudo sed -i '/^\[Desktop Entry\]/a StartupWMClass=com.andybeg.road' "/usr/share/applications/road.desktop"
  - echo "Search and remove road.desktop from .local"
  - for user_dir in /home/*; do if [ -f "$user_dir/.local/share/applications/road.desktop" ]; then rm -f "$user_dir/.local/share/applications/road.desktop"; echo "Found and removed road.desktop from $user_dir .local"; fi; done
  - update-desktop-database /usr/share/applications
  - echo "Road is ready to use :)"

# Post-uninstallation tasks:
# 1. Iterate through all user directories to remove Road configuration and data
# 2. Clean up root user data to ensure a clean removal
postuninstall_scripts:
  - echo "Removing Road user data..."
  - for user_dir in /home/*; do if [ -d "$user_dir/.local/share/road" ]; then rm -rf "$user_dir/.local/share/road"; echo "Removed data from $user_dir"; fi; done
  - rm -rf /root/.local/share/road
  - echo "Road data cleanup complete."

