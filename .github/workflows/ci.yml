name: CI
on:
  workflow_dispatch:
    inputs:
      upload-artifact:
        description: Sign and attach release artifacts (needs Apple/Windows secrets)
        type: boolean
        default: false
  # pull_request:
  #   paths-ignore:
  #     - '**.md'
  #     - 'docs/**'
  #     - 'test.configs/**'
  #     - '.vscode/'
  #     - 'appcast.xml'
  push:
    branches:
       - main
       - dev
       - android-fix-action-bug
       - new-design-v2 
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/'
      - 'appcast.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions: write-all
    if: "${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'release: version') }}"
    with:
      upload-artifact: ${{ github.event_name == 'push' || inputs.upload-artifact }}
       
